name: Compilar Solo DLLs Modulares (Compatibilidad CUDA)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Descargar código directamente de Gondoi
        uses: actions/checkout@v4
        with:
          repository: 'gondoi/llama.cpp'
          ref: 'cpu-avx-vnni-q2_0'

      - name: Instalar CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.6.0'
          method: 'network'
          use-github-cache: 'false'

      # PARCHE DE COMPILADOR: Evitamos que MSVC inyecte instrucciones AVX2 de forma silenciosa
      - name: Parchear flags del compilador para evitar AVX2
        run: |
          (Get-Content ggml/src/CMakeLists.txt) -replace '/arch:AVX2', '/arch:AVX' | Set-Content ggml/src/CMakeLists.txt

      # CONFIGURACIÓN DE SEGURIDAD: Deshabilitamos FMA, AVX2, F16C y forzamos AVX clásico
      - name: Configurar CMake (Flags de Compatibilidad Absoluta)
        run: |
          cmake -B build -DGGML_CUDA=ON -DGGML_BACKEND_SHARED=ON -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_AVX512=OFF -DCMAKE_GENERATOR_PLATFORM=x64 -DCMAKE_CXX_FLAGS="/arch:AVX" -DCMAKE_C_FLAGS="/arch:AVX"

      # COMPILACIÓN EXCLUSIVA: Solo compilamos las librerías dinámicas (DLLs)
      - name: Compilar Exclusivamente DLLs (Modular)
        run: |
          cmake --build build --config Release --target ggml ggml-base ggml-cpu ggml-cuda -j 4

      # COPIAR DEPENDENCIAS DE CUDA
      - name: Copiar dependencias de CUDA requeridas
        run: |
          copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.6\bin\cudart64_12.dll" build\bin\Release\
          copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.6\bin\cublas64_12.dll" build\bin\Release\
          copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.6\bin\cublasLt64_12.dll" build\bin\Release\

      # SUBIR SOLO EL CONTENIDO DLL
      - name: Subir DLLs empaquetadas
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-dlls-solamente
          path: |
            build/bin/Release/*.dll
